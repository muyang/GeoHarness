<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · GeoHarness</title><link rel="stylesheet" href="/ui/login.css"></head>
<body><main><section class="intro"><a class="brand" href="/">◈ GeoHarness</a><p class="eyebrow">YOUR ACCOUNT · YOUR WORKSPACE</p><h1>连接你的<br>地理工作空间。</h1><p>发现公共产品，用自然语言组织任务，<br>在地图中查看每一步成果。</p><div class="features"><span>GeoCard 产品市场</span><span>GeoLibre 地图</span><span>AI 任务编排</span></div></section>
<section class="login"><div class="card"><p class="eyebrow">WELCOME BACK</p><h2>使用 Platform 账号登录</h2><p>与平台共享模型配置、对话、任务和案例。</p><form id="login-form"><label>用户名或邮箱<input id="username" autocomplete="username" required maxlength="254" autofocus placeholder="输入 Platform 用户名或邮箱"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="64"></label><label class="option"><input id="import-model" type="checkbox">将本机原有模型配置迁入此账号（仅在账号尚未配置时）</label><button id="submit" type="submit">登录并进入工作台 →</button><p id="status" role="status" aria-live="polite"></p></form><p class="endpoint">账号服务 <span id="platform-url">正在确认…</span></p><p class="note">密码仅发送至固定的 Platform 身份服务，不保存在客户端。现有账号数据会继续保留。</p><a id="open-platform" href="http://127.0.0.1:3301/" target="_blank" rel="noopener">打开 GeoNexus Platform ↗</a></div></section></main><script src="/ui/login.js"></script></body></html>
