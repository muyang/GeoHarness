[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoharness-client"
version = "0.2.2"
description = "Independent GeoCard product host, MCP client and configurable LLM workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["geonexus-sdk[mcp,server]>=1.1,<2"]

[project.optional-dependencies]
platform = ["geonexus-plugins[mcp]>=0.1,<0.2", "geokg[mcp]>=0.2,<0.3"]
geolibre = ["geolibre[mcp]==3.3.0", "rasterio>=1.4,<2", "Pillow>=10,<13"]
test = ["pytest>=7.4", "pytest-asyncio>=0.24,<2"]

[project.scripts]
geoharness = "geo_harness.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geo_harness*"]

[tool.setuptools.package-data]
geo_harness = ["ui/*", "ui/geo-viewer/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
